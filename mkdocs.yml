site_name: Thermostat Pro Timeline
repo_name: qlerup/thermostat-pro-timeline
repo_url: https://github.com/qlerup/thermostat-pro-timeline

theme:
  name: material
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Support: support.md

  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md

  - Card:
      - Configuration: card/configuration.md
      - Examples: card/examples.md
      - Internationalization: card/internationalization.md
      - Features:
          - Weekdays: card/features/weekdays.md
          - Profiles: card/features/profiles.md
          - Presence & away: card/features/presence-away.md
          - Holidays: card/features/holidays.md
          - Seasonal: card/features/seasonal.md
          - Open Window Detection: card/features/open-window.md
          - Boiler control: card/features/boiler.md
          - Color ranges: card/features/colors.md
          - Storage & backup: card/features/storage.md

  - Integration:
      - Services: integration/services.md
      - API endpoints: integration/api.md

  - Troubleshooting: troubleshooting.md
  - License: license.md
